api:
  circuit_breaker_cooldown_min: 15
  circuit_breaker_max_failures: 5
  instrument_cache_ttl: 3600
  retry_base_delay: 1.0
  retry_max: 3
  retry_max_delay: 30.0
dashboard:
  bot_emoji: 🔥
  bot_name: 🔥 PHOENIX SCALPER
  bot_version: v5.1-50USD
  host: 0.0.0.0
  port: 8502
# ── Exchange ────────────────────────────────────────────
exchange:
  name: binance
  # Fuente principal del modo testnet/mainnet.
  # Si TESTNET está definido en secrets.env, debe coincidir con este valor.
  testnet: true               # CAMBIA A false CUANDO QUIERAS MAINNET
  # ⚠️ NUNCA CAMBIES A MAINNET SIN HACER PAPER TRADING PRIMERO.
  # Para mainnet real también se exige LIVE_TRADING_CONFIRMED=true.
execution:
  loop_sleep_no_position: 120   # 2 min sin posición (ahorra rate limit)
  loop_sleep_position: 30       # 30s con posición abierta
# ── Paper Trading (OBLIGATORIO probar antes de mainnet) ─
paper_trading:
  enabled: true                 # true → PaperExecutor (sin riesgo real)
  initial_balance: 50           # tu capital real
  slippage_pct: 0.0005          # 0.05% slippage (XRP es líquido)
  commission_pct: 0.0005        # 0.05% taker fee Binance
  maker_commission_pct: 0.0001  # 0.01% maker fee Binance
indicators:
  ma_periods:
  - 5
  - 10
  - 20
  rsi_period: 14
  vol_ma_fast: 5
  vol_ma_slow: 10
market_data:
  funding_rate:
    enabled: true
    extreme_high: 0.01
    extreme_low: -0.01
  open_interest:
    change_threshold_pct: 15.0
    enabled: false
# ── FASES DE ESCALAMIENTO ────────────────────────────────
# CALIBRADAS PARA CAPITAL MÍNIMO DE $50
# XRPUSDT es el ÚNICO símbolo viable con este capital
phases:
  0:
    balance_max: 100
    balance_min: 0
    breakeven_trigger: 0.45       # 45% hacia TP1 (más selectivo, evita micro-pérdidas)
    descripcion: 💎 FASE 0 [$50-100] | tp1_rr=2.0 tp2_rr=3.0 | risk=0.6%
    lateral_adx_min: 22
    lateral_ma_distance: 0.005
    leverage: 1                    # SIN apalancamiento para $50
    max_dd_daily: 0.03             # 3% de DD diario máximo
    max_dd_weekly: 0.08
    max_dd_monthly: 0.12
    max_consecutive_losses: 2      # MÁXIMO 2 pérdidas seguidas
