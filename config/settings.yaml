# ── Portfolio ───────────────────────────────────────────
portfolio:
  spread_max_default: 0.15
  # Grupos de correlación (solo XRPUSDT activo)
  correlation_groups:
    - name: "altcoins"
      symbols: ["XRPUSDT"]
      max_concurrent: 1
  symbols:
  - active: true
    allocation_pct: 1.0            # 100% del capital en XRP
    leverage: 1
    risk_per_trade: 0.006
    spread_max: 0.15
    symbol: XRPUSDT
  # ⚠️ ETHUSDT Y DOGEUSDT DESACTIVADOS: no son viables con $50
  # - active: false
  #   allocation_pct: 0.0
  #   symbol: ETHUSDT
  # - active: false
  #   allocation_pct: 0.0
  #   symbol: DOGEUSDT
# ── Portfolio Risk ──────────────────────────────────────
portfolio_risk:
  enabled: true
  var_confidence: 0.95
  var_lookback_days: 30
  max_exposure_usdt: 50            # Límite = tu capital total
  max_exposure_pct: 100            # 100% del balance
# ── Kelly Sizing ────────────────────────────────────────
kelly_sizing:
  enabled: true
  window_size: 20
  min_trades: 5
  max_multiplier: 1.3              # Techo reducido para $50
  min_multiplier: 0.4
  fractional: 0.20                 # 20% de Kelly (más conservador)
  streak_boost: 0.03               # +3% por win consecutivo
  streak_penalty: 0.10             # -10% por loss consecutivo
  max_streak_boost: 0.15           # +15% máximo por racha
  conservative_tier_threshold: 30  # Menos trades para salir de bootstrap
  conservative_max_multiplier: 1.1 # Techo de bootstrap
# ── Secrets Manager ─────────────────────────────────────
secrets:
  required_keys:
    - BINANCE_API_KEY
    - BINANCE_API_SECRET
    - TELEGRAM_TOKEN
    - TELEGRAM_CHAT_ID
    - DISCORD_WEBHOOK
  vault:
    enabled: false
    url: ""
    path: secret/data/trading-bot
    mount: secret
    ttl: 300
  enc_file: config/secrets.env.enc
  enc_key_env: SECRETS_ENCRYPTION_KEY
# ── Graceful Shutdown ───────────────────────────────────
shutdown:
  timeout: 30
  close_positions: true
  notify: true
# ── Métricas ────────────────────────────────────────────
metrics:
  enabled: true
  port: 8000
  json_path: data/metrics.json
# ── Tracing ─────────────────────────────────────────────
tracing:
  # Deshabilitado por defecto para no inundar stdout con spans.
  # Para habilitar: exporter: otlp + otlp_endpoint.
  enabled: false
  exporter: otlp
  otlp_endpoint: ""
  sampling_rate: 1.0
rate_limiter:
  enabled: true
  max_tokens: 10.0
  tokens_per_second: 5.0
supported_coins:
  XRPUSDT:
    description: ✅ ÚNICO VIABLE CON $50 | Buena liquidez, movimientos claros
    name: XRP
    recommended_leverage: 1
    volatility: Media-Alta
  # Los demás símbolos requieren $200+ para ser rentables
  ETHUSDT:
    description: ⚠️ REQUIERE $200+ | Comisiones altas para capital pequeño
    name: Ethereum
    recommended_leverage: 2
    volatility: Media
  DOGEUSDT:
    description: ⚠️ REQUIERE $200+ | Demasiado volátil para $50
    name: Dogecoin
    recommended_leverage: 1
    volatility: Alta
  SOLUSDT:
    description: ❌ REQUIERE $500+ | Muy riesgoso
    name: Solana
    recommended_leverage: 1
    volatility: Muy Alta
symbol: XRPUSDT
timeframes:
  entry: '15'
  limit_entry: 30
  limit_primary: 30
  primary: '60'
timezone: America/Asuncion
websocket:
  # Deshabilitado hasta integrar los buffers WS en SymbolRunner.
  # El camino REST ya está normalizado y es el usado actualmente.
  enabled: false
  kline_intervals:
  - 15
  - 60
  orderbook:
    enabled: true
    depth: 50
