name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with flake8
        run: |
          flake8 bot/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 bot/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Check types with mypy
        run: |
          mypy bot/ --ignore-missing-imports --warn-unused-ignores

      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=short -x

      - name: Benchmark (min 30s)
        run: |
          START=$(date +%s)
          python -m pytest tests/ --tb=short -q -x
          END=$(date +%s)
          DURATION=$((END - START))
          echo "Suite completed in ${DURATION}s"
          if [ "$DURATION" -gt 120 ]; then
            echo "⚠️ Suite took longer than 120s (${DURATION}s)"
          fi
          echo "DURATION=${DURATION}" >> $GITHUB_ENV
