# ── Modo de ejecución ───────────────────────────────────
# true → solo monitor de señales; NUNCA envía órdenes.
monitor_only: true

# ── Exchange ────────────────────────────────────────────
exchange:
  name: binance
  testnet: true

# ── Monitor de 1 símbolo (solo lectura) ─────────────────
monitor:
  enabled: true
  symbols:
  - XRPUSDT
  capital_pyg: 100000           # Capital real a monitorear
  fx_usd_pyg: 7300              # Ajustar al P2P del día (1 USDT ≈ X PYG)
  risk_per_trade: null          # null → usa el risk_per_trade de la fase
  max_risk_pct_hard: 0.02       # No sugerir trades que arriesguen > 2%
  kline_limit: null             # null → mismas velas que el runner live (paridad)
  use_mainnet_data: true        # Precios públicos Mainnet, sin API keys
  notify: true                  # Telegram/Discord solo si están configurados
  session_only: false           # true → no avisar fuera de sesión/día permitido
  fee_pct: 0.0005               # Taker por lado (ida y vuelta = 2x)

# ── Scanner global (radar async, solo lectura) ───────────
scanner:
  use_mainnet: true             # datos públicos Mainnet
  min_quote_volume_24h: 5000000 # $5M volumen 24h mínimo (filtra basura)
  max_symbols: 60               # techo del universo rastreado
  symbols_per_shard: 50         # streams por socket combinado
  depth_levels: 20              # 5 | 10 | 20 (niveles del book parcial)
  depth_symbols_limit: 30       # solo top-N por volumen llevan depth
  funding_poll_seconds: 60
  signal_queue_maxlen: 200
  signal_cooldown_seconds: 120
  obi_extreme: 0.35
  volume_zscore: 2.0
  delta_extreme: 0.2
  volume_delta_window_seconds: 60
  funding_extreme: 0.0003
  liq_cascade_min_events: 3
  liq_cascade_min_notional: 2000000
  min_confidence: 0.4
  min_reasons: 2
  top_n: 3
  w_confidence: 0.5
  w_reasons: 0.25
  w_liquidity: 0.15
  w_freshness: 0.1
  freshness_halflife_seconds: 300

# ── Market data (funding / open interest) ────────────────
market_data:
  funding_rate:
    enabled: true
    extreme_high: 0.01
    extreme_low: -0.01
  open_interest:
    enabled: false

