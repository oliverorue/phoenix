[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "phoenix"
version = "5.0.0"
description = "Bot de scalping multi-símbolo para Binance USDⓈ-M Futures"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "loguru>=0.7.0",
    "pandas>=2.0.0",
    "ta>=0.11.0",
    "numpy>=1.24.0",
    "pytz>=2024.1",
    "pydantic>=2.0.0",
    "psutil>=5.9.0",
    "requests>=2.31.0",
    "prometheus_client>=0.25.0",
    "python-binance>=1.0",
    "websockets>=16.0",
    "opentelemetry-api>=1.30.0",
    "opentelemetry-sdk>=1.30.0",
    "opentelemetry-exporter-otlp-proto-http>=1.30.0",

    # Dependencias opcionales (soft dependencies):
    #   cryptography  — AES-256-GCM para secrets_manager (archivo cifrado)
    #   watchdog      — hot-reload de config mediante FileSystemEventHandler
]

[project.optional-dependencies]
crypto = ["cryptography>=44.0.0"]
hotreload = ["watchdog>=6.0.0"]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pytest-timeout>=2.3.0",
    "hypothesis>=6.100.0",
    "flake8>=7.0",
    "mypy>=1.8.0",
]
all = ["phoenix[crypto,hotreload,dev]"]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::DeprecationWarning:websockets.*:",
    "ignore::DeprecationWarning:binance.*:",
]
addopts = "--tb=short -q -m 'not integration'"
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
# Evita que un test colgado (p. ej. uno que toca red) bloquee el CI.
timeout = 120
timeout_method = "thread"
markers = [
    "asyncio: mark test as async",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: tests that require external data",
    "hypothesis: property-based tests con Hypothesis",
]

[tool.setuptools.packages.find]
include = ["bot*", "config*", "scripts*"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = true
exclude = [
    "venv/",
    "data/",
    "logs/",
    ".github/",
]

[tool.flake8]
max_line_length = 127
max_complexity = 10
extend_ignore = [
    "E203",  # whitespace before ':' (PEP 704)
    "W503",  # line break before binary operator
    "E501",  # line length (handled by black)
]
per-file-ignores = [
    "__init__.py: F401",
]
exclude = [
    "venv",
    "data",
    "logs",
    ".github",
]
