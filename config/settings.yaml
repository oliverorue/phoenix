    max_dd_weekly: 0.10
    max_dd_monthly: 0.18
    max_consecutive_losses: 3
    max_sl_pct: 0.025
    max_stops_day: 4
    max_volatility_pct: 8.0
    risk_per_trade: 0.015
    rsi_max_long: 35
