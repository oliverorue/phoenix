# =============================================================================
# Docker Compose — Phoenix (Producción)
# =============================================================================
# Uso:
#   docker compose up -d              → Iniciar todo
#   docker compose up -d bot          → Solo el bot
#   docker compose up -d dashboard    → Solo el dashboard
#   docker compose down               → Detener todo
# =============================================================================

services:

  # ─── Bot Principal (con watchdog) ────────────────────────────────
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: phoenix
    restart: unless-stopped
    ports:
      # Metrics exporter (Prometheus)
      - "${METRICS_PORT:-8000}:8000"
    volumes:
      - type: bind
        source: ./data
        target: /app/data
      - type: bind
        source: ./logs
        target: /app/logs
      - type: bind
        source: ./config/settings.yaml
        target: /app/config/settings.yaml
        read_only: true
      - type: bind
        source: ./config/secrets.env
        target: /app/config/secrets.env
        read_only: true
    env_file:
      - ./config/secrets.env
    environment:
      - TZ=America/Asuncion
      - METRICS_PORT=${METRICS_PORT:-8000}
    stop_signal: SIGTERM
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import os; exit(0 if os.path.exists(\"data/bot_state_persistent.json\") else 1)'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - trading-net
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 256M

  # ─── Dashboard Streamlit ─────────────────────────────────────────
  dashboard:
    image: phoenix:latest
    container_name: phoenix-dashboard
    restart: unless-stopped
    command: ["dashboard"]
    ports:
      - "${DASHBOARD_PORT:-8501}:8501"
    volumes:
      - type: bind
        source: ./data
        target: /app/data
      - type: bind
        source: ./logs
        target: /app/logs
      - type: bind
        source: ./config/settings.yaml
        target: /app/config/settings.yaml
        read_only: true
      - type: bind
        source: ./config/secrets.env
        target: /app/config/secrets.env
        read_only: true
    env_file:
      - ./config/secrets.env
    environment:
      - TZ=America/Asuncion
    depends_on:
      - bot
    networks:
      - trading-net
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M

networks:
  trading-net:
    name: trading-network
    driver: bridge
